<section class="min-h-100 py-20">
  <div class="container mx-auto px-4">
    <div class="mb-7 space-y-3">
      <h1 class="title">shop by category</h1>
      <div class="flex items-start justify-between flex-wrap gap-4">
        <p class="subtitle">Browse our wide selection of tech categories</p>

        <button
          routerLink="/shop"
          class="btn-text capitalize text-sm flex items-center gap-1 group"
        >
          view all
          <svg
            lucideArrowRight
            [size]="18"
            class="group-hover:ml-1 transition-all duration-200"
          ></svg>
        </button>
      </div>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-1 md:grid-cols-2 lg:gridcols-3 xl:grid-cols-4 gap-5">
      @for (category of categories(); track category.id) {
        <article
          #categoryCard
          (mouseenter)="onHover(categoryCard)"
          (mouseleave)="onLeave(categoryCard)"
          (click)="navigateToCategory(category.name)"
          class="p-8 rounded-radius border-2 border-border cursor-pointer hover:border-primary"
        >
          <div class="flex items-center gap-3 justify-between">
            <div class="flex items-start gap-3">
              <div class="relative w-16 h-16 rounded-md overflow-hidden shrink-0">
                <img
                  [ngSrc]="category.imageUrl"
                  alt=""
                  fill
                />
              </div>
              <div class="flex flex-col h-16">
                <h4 class="font-bold text-[16px]">{{ category.name }}</h4>
                <p class="text-muted-foreground font-normal text-sm mt-auto">
                  {{ category.productCount }} products
                </p>
              </div>
            </div>
            <svg
              lucideArrowRight
              [size]="18"
              class="my-auto text-primary"
            ></svg>
          </div>
        </article>
      }
    </div>
  </div>
</section>
