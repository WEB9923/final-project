<div class="h-screen">
  <app-back-button></app-back-button>
  <div class="container px-4 mx-auto h-full w-full grid place-items-center">
    <div class="p-5 rounded-radius border-2 border-border sm:w-100 md:w-120 lg:w-130 w-full">
      <div class="flex flex-col gap-3 items-center">
        <div
          class="h-18 w-18 border-3 border-primary/30 rounded-radius bg-primary/20 text-primary flex items-center justify-center"
        >
          <svg
            lucideLock
            [size]="40"
            class=""
          ></svg>
        </div>
        <h2 class="text-2xl font-bold text-foreground">Forgot Password?</h2>
        <p class="subtitle">Enter your email and we'll send you a reset link</p>
      </div>

      <form (submit)="handleResetPassword($event)" class="flex flex-col gap-4 mt-10">
        <div class="relative">
          <input
            type="email"
            name="email"
            [(ngModel)]="emailValue"
            placeholder="Email Address"
            class="input w-full py-4 pl-10 text-[17px] text-foreground placeholder:text-[15.5px]"
            autocomplete="off"
          />
          <svg
            lucideMail
            [size]="24"
            class="absolute top-1/2 -translate-y-1/2 left-2 text-muted-foreground"
          ></svg>
        </div>

        <button
          class="my-4! w-full btn rounded-lg! py-7! hover:shadow-lg transition-all! duration-200! flex items-center gap-2 justify-center"
        >
          <svg
            lucideSend
            [size]="20"
          ></svg>
          Send reset link
        </button>

        <a
          routerLink="/login"
          class="text-muted-foreground hover:text-primary transition-colors duration-200 text-sm font-normal flex items-center gap-1 text-center! justify-center"
        >
          <svg
            lucideArrowLeft
            [size]="18"
          ></svg>
          Back to login page
        </a>
      </form>
    </div>
  </div>
</div>
