<div class="h-screen">
  <app-back-button></app-back-button>
  <div class="container px-4 mx-auto h-full w-full grid place-items-center">
    <div class="p-5 rounded-radius border-2 border-border sm:w-100 md:w-120 lg:w-130 w-full">
      <div class="flex flex-col gap-3 items-center">
        <div
          class="h-18 w-18 border-3 border-primary/30 rounded-radius bg-primary/20 text-primary flex items-center justify-center"
        >
          <svg
            lucideLogIn
            [size]="40"
            class=""
          ></svg>
        </div>
        <h2 class="text-2xl font-bold text-foreground">Welcome Back</h2>
        <p class="subtitle">Sign in to continue shopping 🛒</p>
      </div>

      <form
        (submit)="handleLogin($event)"
        class="flex flex-col gap-4 mt-10"
      >
        @for (formItem of formItems; track $index) {
          <div class="relative">
            <input
              [type]="
                formItem.isPassword ? (formItem.showPassword ? 'text' : 'password') : formItem.type
              "
              [name]="formItem.name"
              [(ngModel)]="formData[formItem.name]"
              [placeholder]="formItem.placeholder"
              class="input w-full py-4 pl-10 text-[17px] text-foreground placeholder:text-[15.5px]"
              autocomplete="off"
              [ngClass]="{ 'pr-14': formItem.isPassword }"
            />
            <svg
              [lucideIcon]="formItem.icon"
              [size]="24"
              class="absolute top-1/2 -translate-y-1/2 left-2 text-muted-foreground"
            ></svg>
            @if (formItem.isPassword) {
              <button
                (mousedown)="togglePassword($event, formItem)"
                type="button"
                class="bg-secondary rounded-lg cursor-pointer w-9 h-9 flex items-center justify-center absolute! top-1/2 -translate-y-1/2 right-2"
              >
                <svg
                  [lucideIcon]="formItem.showPassword ? LucideEyeOff : LucideEye"
                  [size]="24"
                  class="text-muted-foreground"
                ></svg>
              </button>
            }
          </div>
        }
        <div class="flex justify-end">
          <button
            type="button"
            routerLink="/forgot-password"
            class="text-sm font-medium text-primary/80 hover:text-primary transition-colors duration-200 cursor-pointer"
          >
            forgot password?
          </button>
        </div>

        <button class="w-full btn rounded-lg! py-7! hover:shadow-lg transition-all! duration-200!">
          Log in
        </button>

        <div class="flex items-center gap-2 justify-between my-4">
          <div class="h-0.5 w-full bg-border rounded-radius"></div>
          <span class="shrink-0 text-[15px] text-foreground">or</span>
          <div class="h-0.5 w-full bg-border rounded-radius"></div>
        </div>

        <p class="text-muted-foreground text-sm text-center font-normal">
          Don&apos;t have an account?
          <a
            routerLink="/register"
            class="text-primary font-medium cursor-pointer"
          >
            Create one now
          </a>
        </p>
      </form>
    </div>
  </div>
</div>
